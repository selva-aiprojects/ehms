name: ehms_mobile
description: "HostSphere - Luxury Hospitality Management Suite"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Core
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.3
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # UI & Graphics
  flutter_animate: ^4.5.2
  fl_chart: ^0.70.2
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.17
  lottie: ^3.3.1
  google_fonts: ^6.2.1
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3
  material_design_icons_flutter: ^7.0.7296

  # Offline & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Device Features
  local_auth: ^2.3.0
  geolocator: ^14.0.0
  image_picker: ^1.1.2
  camera: ^0.11.0+2
  permission_handler: ^11.4.0

  # Notifications
  flutter_local_notifications: ^18.0.1
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.1

  # Network & Sync
  connectivity_plus: ^6.1.3
  http: ^1.3.0

  # Utils
  intl: ^0.20.2
  uuid: ^4.5.1
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  image_path: "assets/images/hostsphere-logo.png"
  android:
    enable: true
    adaptive_icon_foreground: "assets/images/hostsphere-logo.png"
    adaptive_icon_background: "#255230"
    generate: true
  ios:
    enable: true
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

  fonts: []
